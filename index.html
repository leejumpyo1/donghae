<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donghae Error Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a service technician's tool — calm, exact, no decoration.
   IDEA: the machine's own controller display and the service manual's checking table.
   PICTURE: a large code readout beside a side-view of the truck that lights up the controller that raised it.
   COLOUR and TYPE: steel panel, black ink, white, alarm red; Inter Tight + Inter / Noto Sans KR.
   LAYOUT: search and filters on top, code list left, diagnosis panel right; stacked on phones. */
:root{color-scheme:light;
--bg:light-dark(#d5dbe0,#16191c);--panel:light-dark(#fff,#1f2327);--ink:light-dark(#0c0d0e,#eef1f3);
--mute:light-dark(#4d565e,#a3adb5);--line:light-dark(#bcc4ca,#343a40);--red:#e8251a;--redsoft:light-dark(#fde4e2,#3a1a18);
--lcd:#101315;--lcdtxt:#ff4a3d;--steel:light-dark(#aeb7be,#3a4148)}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
:lang(ko) body,html[lang=ko] body{font-family:"Noto Sans KR",Inter,system-ui,sans-serif;word-break:keep-all}
h1,h2,h3{font-family:"Inter Tight","Noto Sans KR",sans-serif;margin:0;line-height:1.1;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:#0c0d0e;color:#fff}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;gap:14px;align-items:center}.logo{display:block;height:44px;width:auto}.brand .sep{width:1px;height:32px;background:#ffffff40}
@media(max-width:600px){.logo{height:34px}.brand .sep,.brand>div{display:none}}
.mark{width:34px;height:34px;border-radius:6px;background:var(--red);display:grid;place-items:center;color:#fff;font:700 15px "Inter Tight",system-ui,sans-serif}
.brand b{display:block;font:600 17px/1.2 "Inter Tight","Noto Sans KR",sans-serif}.brand small{opacity:.7;font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,.lang button{height:44px;border-radius:8px;border:1px solid #ffffff40;background:#ffffff14;color:inherit;padding:0 12px}
select option{color:#000}
.lang{display:flex;border-radius:8px;overflow:hidden;border:1px solid #ffffff40}
.lang button{border:0;border-radius:0;background:transparent;min-width:58px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--red);color:#fff}
.top{padding-top:28px;padding-bottom:18px}
.top h1{font-size:clamp(28px,4vw,44px)}
.top p{margin:8px 0 0;color:var(--mute);max-width:70ch}
.search{position:relative;margin-top:18px}
.search input{width:100%;height:56px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);padding:0 16px 0 48px;font-size:18px}
.search svg{position:absolute;left:16px;top:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tabs button{height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.tabs button span{color:var(--mute);font-weight:400;margin-left:4px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button[aria-pressed=true] span{color:inherit;opacity:.7}
main .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start;padding-bottom:40px}
.list{background:var(--panel);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.grp{padding:10px 16px;font-size:13px;color:var(--mute);background:light-dark(#eef1f3,#191c1f);border-bottom:1px solid var(--line);font-weight:600}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;align-items:center;min-height:56px}
.row:hover{background:light-dark(#f4f6f7,#262a2f)}
.row[aria-current=true]{background:var(--redsoft);box-shadow:inset 4px 0 var(--red)}
.code{font:700 18px "Inter Tight",system-ui,sans-serif;letter-spacing:.02em}
.row .t{font-weight:500}.row .s{display:block;font-size:14px;color:var(--mute)}
.empty{padding:28px 16px;color:var(--mute)}
.detail{position:sticky;top:16px}
.card{background:var(--panel);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.hero{display:grid;grid-template-columns:minmax(0,1fr);background:#f4f5f6}
.lcd{background:var(--lcd);margin:16px;min-height:150px;border-radius:8px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;box-shadow:inset 0 2px 10px #000}
.lcd .big{font:700 clamp(52px,7vw,76px)/1 "Inter Tight",system-ui,sans-serif;color:var(--lcdtxt);text-shadow:0 0 14px #ff3b2f80;letter-spacing:.04em}
.lcd .where{color:#c9d1d7;font-size:13px}
.fig{position:relative;display:grid;place-items:center;padding:12px 16px 12px 0;background:#f4f5f6}
.pic{position:relative;width:100%;max-width:420px;aspect-ratio:600/310}.pic svg{width:100%;height:100%;display:block}
.dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #fff,0 2px 8px #0006}
.tag{position:absolute;white-space:nowrap;background:#0c0d0e;color:#fff;font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px}
.body{padding:20px}
.body h2{font-size:clamp(24px,3vw,32px)}
.ctrl{color:var(--mute);margin-top:6px;font-size:15px}
.fix{margin-top:16px;border-left:4px solid var(--red);background:var(--redsoft);padding:12px 14px;border-radius:0 8px 8px 0}
.fix b{display:block;font-size:13px;color:var(--mute);font-weight:600}
.fix p{margin:2px 0 0;font-size:18px;font-weight:500}
h3{font-size:17px;margin:22px 0 8px}
ol.steps,ul.ck{margin:0;padding-left:22px}ol.steps li,ul.ck li{margin:4px 0}
.sensor{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.sensor h4{margin:0 0 6px;font:600 16px "Inter Tight","Noto Sans KR",sans-serif}
.kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 12px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.volt{white-space:nowrap;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:2px 8px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.copy{margin-top:14px;height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer}
.pre{background:light-dark(#eef1f3,#191c1f);border-radius:10px;padding:12px 14px;margin-top:10px}
.pre ol{margin:6px 0 0;padding-left:22px}
footer{color:var(--mute);font-size:13px;padding:0 0 32px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:18px;font-size:15px}
.crumbs button{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.crumbs span{color:var(--mute)}.crumbs b{font-family:"Inter Tight",sans-serif;font-size:16px;padding:0 4px}
.pick{padding-top:20px;padding-bottom:48px}.pick h1{font-size:clamp(28px,4vw,44px)}.pick p{color:var(--mute);margin:8px 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cards.m{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.cardb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:96px}
.cardb:hover:not(:disabled){border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.cardb .nm{font:700 30px/1 "Inter Tight",sans-serif}.cards.m .cardb .nm{font-size:24px}
.cardb .sub{font-size:14px;color:var(--mute)}.cardb .ok{color:var(--red);font-weight:600}
.cardb:disabled{cursor:default;opacity:.55}
.cardb .mini{width:100%;background:#f4f5f6;border-radius:8px;padding:8px 10px;margin-bottom:4px}.cardb .mini{height:170px;display:grid;place-items:center}.cardb .mini svg{display:block;max-height:100%}.cardb .mini img{display:block;width:100%;height:100%;object-fit:contain;min-height:0}.cardb .mini{overflow:hidden}.cardb .mini svg{width:100%}
@media(max-width:600px){.cardb .mini{height:120px}.cards,.cards.m{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cardb{padding:12px}.cardb .nm{font-size:24px}.cards.m .cardb .nm{font-size:19px}}
@media(max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}.detail{position:static;order:-1}}
@media(max-width:520px){.hero{grid-template-columns:minmax(0,1fr)}.fig{padding:0 12px 12px}.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}}
@media(prefers-reduced-motion:no-preference){.hl{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #ffffff00,0 2px 8px #0006}}}
</style>
</head>

const SERIES=[{k:"DHS",m:[["950L","dhs"],["1200L","dhs"]]},{k:"DHAS",m:[["120AP",null]]},
{k:"DHT",m:[["150S","dht"],["150AS","dht"],["160S","dht"],["160AS","dht"],["120",null],["150L",null],["170S",null],["170AS",null],["180S",null]]},
{k:"DHTA",m:[["1800S",null]]}];
let ser=null,mod=null;
let L="en",grp="all",cur=null,M="dht",C=C1,G=G1;
try{L=localStorage.getItem("dh-lang")||(navigator.language||"").startsWith("ko")&&"ko"||"en"}catch(e){}
const $=s=>document.querySelector(s),t=k=>T[L][k];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=x=>L==="ko"?x.ko:x.en, sl=x=>L==="ko"?x.sKo:x.sEn;

// DHT 160AS vector drawing, controller spots in % of the image
const IMG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 160 600 310" role="img" aria-label="Aerial platform truck">
<g transform="translate(600 0) scale(-1 1)" stroke="#1d1f21" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<rect x="10" y="458" width="580" height="7" rx="3" fill="#2d3236" stroke="none"/>
<path d="M52 380v68M318 380v68" stroke="#4a5055" stroke-width="12" stroke-linecap="butt"/>
<path d="M40 450h26M306 450h26" stroke-width="4"/>
<rect x="36" y="368" width="330" height="26" fill="#2d3236"/>
<rect x="30" y="340" width="310" height="28" rx="2" fill="#d3d7da"/>
<path d="M30 356h310" stroke="#9aa1a7"/>

<rect x="254" y="312" width="42" height="68" rx="2" fill="none" stroke="#7d858c"/>
<rect x="258" y="346" width="10" height="6" rx="2" fill="#5b6268" stroke="none"/>

<path d="M372 284l-16 38M396 284l-12 38" stroke="#8c949a" stroke-width="5" fill="none"/>

<path d="M330 352h148" stroke="#8c949a"/>
<rect x="380" y="360" width="18" height="5" rx="2" fill="#2d3236" stroke="none"/>
<path d="M470 346h14v18h-14z" fill="#f39200"/>
<path d="M466 394h24v-28h-24z" fill="#d3d7da"/>
<path d="M330 394h150v14H330z" fill="#2d3236"/>
<rect x="66" y="318" width="96" height="22" rx="3" fill="#5b6268"/>
<path d="M76 318l14-62h48l14 62z" fill="#f5f6f7"/>
<path d="M126 314l40-58" stroke="#5b6268" stroke-width="11"/>
<path d="M90 240h330v22H104l-14-8z" fill="#f5f6f7"/>
<path d="M110 262h310" stroke="#2d3236" stroke-width="4"/>
<rect x="240" y="236" width="16" height="30" rx="3" fill="#e8ebed"/>
<rect x="330" y="236" width="14" height="30" rx="3" fill="#e8ebed"/>
<circle cx="112" cy="252" r="7" fill="#e8ebed"/><circle cx="136" cy="306" r="6" fill="#e8ebed"/>
<path d="M420 252h16" stroke="#5b6268" stroke-width="10"/>
<rect x="434" y="184" width="64" height="66" rx="6" fill="#f5f6f7"/>
<rect x="430" y="176" width="72" height="12" rx="4" fill="#d3d7da"/>
<path d="M434 228h64" stroke="#e8251a" stroke-width="6" stroke-linecap="butt"/>
<rect x="438" y="246" width="56" height="12" rx="3" fill="#5b6268"/>
<g fill="#1d1f21" stroke="none">
<circle cx="152" cy="412" r="38"/><circle cx="404" cy="412" r="38"/>
</g>
<g fill="#c9ced2"><circle cx="152" cy="412" r="18"/><circle cx="404" cy="412" r="18"/></g>
<g fill="#2d3236" stroke="none"><circle cx="152" cy="412" r="6"/><circle cx="404" cy="412" r="6"/></g>
</g>
</svg>
`;
const SPOT={P:[22,18],C:[81,45],F:[58,72],L:[93,63],E:[93,63]};
const LAB={P:["Bucket controller","버킷 컨트롤러"],C:["Post controller","포스트 컨트롤러"],F:["Main controller","메인 컨트롤러"],L:["Lower controller","하부 컨트롤러"],E:["Lower controller","하부 컨트롤러"]};
function truck(g){const sp=SPOT[g];
  return `<div class="pic">${IMG}${sp?`<span class="dot hl" style="left:${sp[0]}%;top:${sp[1]}%"></span><span class="tag" style="left:${sp[0]}%;top:${sp[1]}%;${sp[0]>60?"transform:translate(calc(-100% - 14px),-50%)":"transform:translate(14px,-50%)"}">${LAB[g][L==="ko"?1:0]}</span>`:""}</div>`}

function match(x,q){if(!q)return true;q=q.toLowerCase().replace(/[\s.]+/g,"");
  if(!q)return true;
  if(/^[a-z]\d{1,2}$/.test(q))return x.id.toLowerCase().startsWith(q);
  if(/^\d+$/.test(q)){const n=x.id.slice(1);return n===q||n===q.padStart(2,"0")||n.includes(q)}
  const hay=[x.id,x.en,x.ko,x.sEn,x.sKo,x.symEn||"",x.symKo||"",...x.sn.map(i=>S[i][3]+S[i][4]+S[i][1]+S[i][2])].join(" ").toLowerCase().replace(/\s+/g,"");
  return hay.includes(q)}

function renderTabs(){const q=$("#q").value.trim();
  const keys=["all",...Object.keys(G)];
  $("#tabs").innerHTML=keys.map(k=>{const n=C.filter(x=>(k==="all"||x.g===k)&&match(x,q)).length;
    const gn=k==="all"?"":L==="ko"?G[k].ko:G[k].en;const lbl=k==="all"?t("all"):k.length>1?gn:`${k} · ${gn.split(" — ")[0].split(" (")[0]}`;
    return `<button data-g="${k}" aria-pressed="${grp===k}">${esc(lbl)}<span>${n}</span></button>`}).join("")}

function renderList(){const q=$("#q").value.trim();
  const rows=C.filter(x=>(grp==="all"||x.g===grp)&&match(x,q));
  if(!rows.length){$("#list").innerHTML=`<div class="empty">${esc(t("none"))}</div>`;return rows}
  let h="",last="";
  for(const x of rows){if(x.g!==last){h+=`<div class="grp">${esc(L==="ko"?G[x.g].ko:G[x.g].en)}</div>`;last=x.g}
    h+=`<button class="row" data-c="${x.id}" aria-current="${cur===x.id}"><span class="code">${x.c}</span><span><span class="t">${esc(x.c==="L04"?t("spare"):nm(x))}</span><span class="s">${esc(sl(x).split("\n")[0].replace(/^\d+\.\s*/,""))}</span></span></button>`}
  $("#list").innerHTML=h;return rows}

function sensorBox(i){const s=S[i],k=L==="ko"?1:0,o=L==="ko"?1:0;
  const nmS=s[3+o],pos=s[1+o],s1=s[6+o],s2=s[8+o];
  return `<div class="sensor"><h4>№${i} · ${esc(nmS)}</h4><dl class="kv">
  <dt>${esc(t("kind"))}</dt><dd>${esc(s[0][k])}</dd>
  <dt>${esc(t("pos"))}</dt><dd>${esc(pos)}</dd>
  <dt>${esc(t("range"))}</dt><dd><span class="volt">${esc(L==="ko"?s[5].replace(" or "," 또는 ").replace("Low","낮음"):s[5])}</span></dd>
  <dt>${esc(t("s1"))}</dt><dd>${esc(s1)}</dd>
  ${s2?`<dt>${esc(t("s2"))}</dt><dd>${esc(s2)}</dd>`:""}
  <dt>${esc(t("rep"))}</dt><dd class="chips">${[...s[10]].map(r=>`<span class="chip">${r} · ${esc(RP[r][k])}</span>`).join("")}</dd>
  </dl></div>`}

const sy=x=>L==="ko"?x.symKo:x.symEn;
function lines(s,big){const a=s.split("\n");if(a.length===1)return big?`<p>${esc(s)}</p>`:`<p style="margin:0">${esc(s)}</p>`;
  return `<ul class="ck"${big?' style="font-size:17px;font-weight:500;margin-top:4px"':""}>${a.map(v=>`<li>${esc(v.replace(/^\d+\.\s*/,""))}</li>`).join("")}</ul>`}
function notes(g){return `<ul class="ck">${g.notes[L].map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`}
function renderDetail(){
  const x=C.find(y=>y.id===cur);
  if(!x){$("#detail").innerHTML=`<div class="card"><div class="hero"><div class="lcd"><div class="big">---</div><div class="where">${esc(t("ph"))}</div></div></div>
  <div class="body">${M==="dht"?`<h3 style="margin-top:0">${esc(t("preT"))}</h3><ol class="steps">${t("pre").map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p class="note" style="border:0;padding:0">${esc(t("preN"))}</p>`:`<h3 style="margin-top:0">${esc(t("notes"))}</h3>${notes(G.ERR)}`}</div></div>`;return}
  const g=G[x.g],gl=L==="ko"?g.ko:g.en;
  const sens=x.sn.map(sensorBox).join("");
  const ck=x.ck?CK[x.ck][L]:[];
  $("#detail").innerHTML=`<div class="card">
  <div class="hero"><div class="lcd"><div class="big">${x.c}</div><div class="where">${M==="dht"?esc(t("shown"))+": "+esc(gl):esc(ser+" "+mod)+" · "+esc(gl)}</div></div></div>
  <div class="body">
   <h2>${esc(x.c==="L04"?t("spare"):nm(x))}</h2>
   <div class="ctrl">${x.c} · ${esc(gl)}</div>
   ${sy(x)?`<h3>${esc(t("sym"))}</h3>${lines(sy(x))}`:""}
   ${sl(x)?`<div class="fix"><b>${esc(t("sol"))}</b>${lines(sl(x),1)}</div>`:""}
   ${sens?`<h3>${esc(t("relS"))}</h3>${sens}`:""}
   ${ck.length?`<h3>${esc(t("ck"))}</h3><ul class="ck">${ck.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
   ${g.notes?`<h3>${esc(t("notes"))}</h3>${notes(g)}`:""}
   ${M==="dht"&&x.g==="E"?`<div class="pre"><b>${esc(t("preT"))}</b><ol>${t("pre").map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
   <button class="copy" id="cp">${esc(t("copy"))}</button>
   <p class="note">${M==="dht"?esc(t("src"))+g.pg+(x.sn.length?", 128–131":", 128"):esc(t("src2"))+g.pg+(t("tr")?" · "+esc(t("tr")):"")}</p>
  </div></div>`;
  $("#cp").onclick=async e=>{try{await navigator.clipboard.writeText(location.href.split("#")[0]+"#"+x.id);e.target.textContent=t("copied")}catch(err){e.target.textContent="#"+x.id}};
}

function hashFor(id){return "#"+[ser,mod,id].filter(Boolean).join("-").toLowerCase()}
function setHash(){const hh=ser?hashFor(cur):"";if(location.hash!==hh)history.replaceState(null,"",hh||location.pathname+location.search)}
function renderCrumbs(){
  if(!ser){$("#crumbs").innerHTML="";return}
  $("#crumbs").innerHTML=`<button data-go="home">← ${esc(t("series"))}</button><span>›</span><b>${esc(ser)}</b>${mod?`<span>›</span><button data-go="ser">${esc(t("pickM"))}</button><span>›</span><b>${esc(ser+" "+mod)}</b>`:""}`}
function renderPick(){
  if(!ser){$("#pick").innerHTML=`<h1>${esc(t("pickS"))}</h1><p>${esc(t("pickSl"))}</p><div class="cards">${SERIES.map(s=>{const n=s.m.filter(m=>m[1]).length;
    return `<button class="cardb" data-s="${s.k}"><div class="mini">${PH[s.k]?`<img src="${PH[s.k]}" alt="${s.k}">`:IMG}</div><span class="nm">${s.k}</span><span class="sub ${n?"ok":""}">${esc(n?t("models")(n):t("nodata"))}</span></button>`}).join("")}</div>`;return}
  const s=SERIES.find(v=>v.k===ser);
  $("#pick").innerHTML=`<h1>${esc(t("pickM"))} · ${esc(ser)}</h1><p>${esc(t("pickMl"))}</p>${s.m.length?`<div class="cards m">${s.m.map(m=>`<button class="cardb" data-m="${m[0]}" ${m[1]?"":"disabled"}><span class="nm">${esc(ser+" "+m[0])}</span><span class="sub ${m[1]?"ok":""}">${esc(m[1]?t("open")+" →":t("nodata"))}</span></button>`).join("")}</div>`:`<p class="empty" style="padding:0">${esc(t("nodata"))}</p>`}`}
function render(){document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i==="lead"&&M==="dhs"?"lead2":el.dataset.i));
  $("#q").placeholder=t("ph");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  renderCrumbs();
  const showCodes=!!(ser&&mod);$("#codes").hidden=!showCodes;$("#pick").hidden=showCodes;
  if(!showCodes){renderPick();return}
  $(".top h1").textContent=ser+" "+mod;
  renderTabs();renderList();renderDetail()}

function setModel(m){M=m;C=MODELS[m].C;G=MODELS[m].G;grp="all"}
function openCode(c,scroll){cur=c;setHash();
  renderList();renderDetail();
  if(scroll&&matchMedia("(max-width:860px)").matches)$("#detail").scrollIntoView({behavior:"smooth",block:"start"})}

$("#q").addEventListener("input",()=>{renderTabs();const rows=renderList();
  const q=$("#q").value.trim().toUpperCase().replace(/[\s.]/g,"");
  const ex=C.find(x=>x.id===q);if(ex&&(grp==="all"||ex.g===grp))openCode(ex.id,false)});
$("#pick").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.s){ser=b.dataset.s;mod=null}
  if(b.dataset.m){mod=b.dataset.m;const d=SERIES.find(v=>v.k===ser).m.find(m=>m[0]===mod)[1];setModel(d);cur=null;$("#q").value=""}
  setHash();render();scrollTo({top:0})});
$("#crumbs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go==="home"){ser=null;mod=null}else{mod=null}cur=null;setHash();render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const f=$("#list .row");if(f)openCode(f.dataset.c,true)}});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;grp=b.dataset.g;renderTabs();renderList()});
$("#list").addEventListener("click",e=>{const b=e.target.closest(".row");if(b)openCode(b.dataset.c,true)});
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;L=b.dataset.l;try{localStorage.setItem("dh-lang",L)}catch(err){}render()});
function fromHash(){const p=location.hash.slice(1).toUpperCase().split("-").filter(Boolean);
  ser=null;mod=null;cur=null;if(!p.length)return;
  const s=SERIES.find(v=>v.k===p[0]);
  if(s){ser=s.k;const m=p[1]&&s.m.find(v=>v[0]===p[1]&&v[1]);if(m){mod=m[0];setModel(m[1]);if(p[2]&&C.some(x=>x.id===p[2]))cur=p[2]}return}
  for(const s2 of SERIES)for(const m of s2.m){if(m[1]&&MODELS[m[1]].C.some(x=>x.id===p[0])){ser=s2.k;mod=m[0];setModel(m[1]);cur=p[0];return}}}
addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();
}
</script>
